# Mira ISO boot menu.
# __KERNEL_PATH__ / __INITRD_PATH__ are substituted by Buildroot at image time.

set default="0"
set timeout="1"

# Appliance boot: quiet, no cursor, no console spam. The rootfs is the
# initramfs, so no root= is needed.
menuentry "Mira" {
	linux __KERNEL_PATH__ quiet loglevel=3 vt.global_cursor_default=0
	initrd __INITRD_PATH__
}

# Kept deliberately: when the shell fails to come up, this is how you find out
# why without rebuilding the image.
menuentry "Mira (verbose console)" {
	linux __KERNEL_PATH__ loglevel=7 console=tty1 console=ttyS0,115200 mira.debug=1
	initrd __INITRD_PATH__
}
