<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #ff4a17; } a:hover { color: #ff734b; }
  </style>
</helmet>

<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0c0c0c; font-family: 'Space Grotesk', system-ui, sans-serif; color: #ffffff;">
  <div style="position: absolute; inset: 0; padding: 76px 80px; box-sizing: border-box; display: flex; flex-direction: column; gap: 44px;">

    <div style="display: flex; justify-content: space-between; align-items: baseline; border-bottom: 3px solid #ffffff; padding-bottom: 22px;">
      <div style="display: flex; align-items: baseline; gap: 22px;">
        <div style="font-size: 34px; font-weight: 700; letter-spacing: -0.02em;">MIRA</div>
        <div style="font-size: 34px; font-weight: 400; color: #ff4a17; letter-spacing: -0.02em;">/ FILMS</div>
      </div>
      <div style="display: flex; align-items: center; gap: 20px; font-size: 17px; letter-spacing: 0.16em; color: rgba(255,255,255,0.55);">
        <span style="width: 11px; height: 11px; background: #ff4a17;"></span>
        <span>NETBIRD UP</span>
        <span style="color: rgba(255,255,255,0.25);">218 TITLES</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 20px;">
      <div style="font-size: 19px; font-weight: 500; letter-spacing: 0.22em; color: rgba(255,255,255,0.48);">CONTINUE</div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 34px;">

        <div style="display: flex; flex-direction: column; gap: 16px;">
          <div style="width: 100%; height: 232px; background: #2c3f46; position: relative;">
            <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 7px; background: rgba(255,255,255,0.20);"><div style="width: 62%; height: 7px; background: #ffffff;"></div></div>
          </div>
          <div style="font-size: 31px; font-weight: 500; letter-spacing: -0.015em;">Ashfall</div>
          <div style="font-size: 18px; color: rgba(255,255,255,0.45);">44 min left</div>
        </div>

        <div style="position: relative; background: #ff4a17; margin: -18px; padding: 18px; display: flex; flex-direction: column; gap: 16px;">
          <div style="position: absolute; inset: -8px; border: 4px solid #ffffff;"></div>
          <div style="width: 100%; height: 232px; background: #0c0c0c; position: relative;">
            <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 7px; background: rgba(255,255,255,0.22);"><div style="width: 38%; height: 7px; background: #ffffff;"></div></div>
          </div>
          <div style="font-size: 31px; font-weight: 700; color: #0c0c0c; letter-spacing: -0.015em;">The Salt Road</div>
          <div style="font-size: 18px; font-weight: 500; color: rgba(12,12,12,0.72);">45 min left &middot; HEVC 4K</div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 16px;">
          <div style="width: 100%; height: 232px; background: #3b3550; position: relative;">
            <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 7px; background: rgba(255,255,255,0.20);"><div style="width: 14%; height: 7px; background: #ffffff;"></div></div>
          </div>
          <div style="font-size: 31px; font-weight: 500; letter-spacing: -0.015em;">Nightjar</div>
          <div style="font-size: 18px; color: rgba(255,255,255,0.45);">1 h 39 left</div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 16px;">
          <div style="width: 100%; height: 232px; background: #4a4231; position: relative;">
            <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 7px; background: rgba(255,255,255,0.20);"><div style="width: 81%; height: 7px; background: #ffffff;"></div></div>
          </div>
          <div style="font-size: 31px; font-weight: 500; letter-spacing: -0.015em;">Quiet Coast</div>
          <div style="font-size: 18px; color: rgba(255,255,255,0.45);">21 min left</div>
        </div>

      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 20px;">
      <div style="font-size: 19px; font-weight: 500; letter-spacing: 0.22em; color: rgba(255,255,255,0.48);">RECENTLY ADDED</div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 34px;">

        <div style="display: flex; flex-direction: column; gap: 16px;">
          <div style="width: 100%; height: 232px; background: #35494f;"></div>
          <div style="font-size: 31px; font-weight: 500; letter-spacing: -0.015em;">Meridian</div>
          <div style="font-size: 18px; color: rgba(255,255,255,0.45);">2018 &middot; 2 h 04</div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 16px;">
          <div style="width: 100%; height: 232px; background: #53343c;"></div>
          <div style="font-size: 31px; font-weight: 500; letter-spacing: -0.015em;">Low Tide</div>
          <div style="font-size: 18px; color: rgba(255,255,255,0.45);">2022 &middot; 1 h 47</div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 16px;">
          <div style="width: 100%; height: 232px; background: #2f4a3a;"></div>
          <div style="font-size: 31px; font-weight: 500; letter-spacing: -0.015em;">Ferrous</div>
          <div style="font-size: 18px; color: rgba(255,255,255,0.45);">2020 &middot; 1 h 52</div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 16px;">
          <div style="width: 100%; height: 232px; background: #40384d;"></div>
          <div style="font-size: 31px; font-weight: 500; letter-spacing: -0.015em;">Cassini</div>
          <div style="font-size: 18px; color: rgba(255,255,255,0.45);">2017 &middot; 2 h 18</div>
        </div>

      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
