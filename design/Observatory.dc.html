<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #8ec5d8; } a:hover { color: #b6dced; }
  </style>
</helmet>

<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #060910; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #e6ecf2;">

  <div style="position: absolute; inset: 0; background-image: linear-gradient(rgba(142,197,216,0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(142,197,216,0.045) 1px, transparent 1px); background-size: 120px 120px;"></div>
  <div style="position: absolute; inset: 0; background: radial-gradient(90% 70% at 84% 8%, rgba(142,197,216,0.10) 0%, rgba(6,9,16,0) 62%);"></div>

  <!-- nav rail -->
  <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 124px; border-right: 1px solid rgba(142,197,216,0.14); background: rgba(9,13,22,0.72); display: flex; flex-direction: column; align-items: center; padding: 68px 0; box-sizing: border-box; gap: 42px;">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#d8b26a" stroke-width="1.4" stroke-linejoin="round"><path d="M12 3.2 13.9 9.4 20.2 9.6 15.2 13.4 17 19.7 12 15.8 7 19.7 8.8 13.4 3.8 9.6 10.1 9.4Z"></path></svg>
    <div style="width: 30px; height: 1px; background: rgba(142,197,216,0.20);"></div>
    <div style="position: relative; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: rgba(142,197,216,0.12);">
      <div style="position: absolute; left: -24px; top: 14px; bottom: 14px; width: 3px; background: #8ec5d8;"></div>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8ec5d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.2" y="4.6" width="7" height="14.8" rx="1"></rect><rect x="13.8" y="4.6" width="7" height="14.8" rx="1"></rect></svg>
    </div>
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(230,236,242,0.42)" stroke-width="1.6" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.6"></circle><path d="m15.6 15.6 4.4 4.4"></path></svg>
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(230,236,242,0.42)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.4 7.4h15.2M4.4 12h15.2M4.4 16.6h15.2"></path></svg>
    <div style="flex-grow: 1;"></div>
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(230,236,242,0.42)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"></circle><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8M18.5 18.5l-1.8-1.8M7.3 7.3 5.5 5.5"></path></svg>
  </div>

  <div style="position: absolute; left: 124px; right: 0; top: 0; bottom: 0; padding: 64px 72px 0 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 38px;">

    <div style="display: flex; justify-content: space-between; align-items: flex-end;">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="font-size: 13px; letter-spacing: 0.34em; color: rgba(142,197,216,0.72);">JELLYFIN &middot; HOMELAB</div>
        <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 62px; line-height: 1; letter-spacing: 0.004em;">Films</div>
      </div>
      <div style="display: flex; align-items: center; gap: 14px;">
        <div style="position: relative; height: 50px; display: flex; align-items: center; padding: 0 26px; font-size: 18px; color: #060910; background: #8ec5d8; border-radius: 2px; font-weight: 500;">
          All 218
          <div style="position: absolute; inset: -7px; border: 1px solid rgba(142,197,216,0.55);"></div>
        </div>
        <div style="height: 50px; display: flex; align-items: center; padding: 0 26px; font-size: 18px; color: rgba(230,236,242,0.68); border: 1px solid rgba(142,197,216,0.24); border-radius: 2px;">Unwatched</div>
        <div style="height: 50px; display: flex; align-items: center; padding: 0 26px; font-size: 18px; color: rgba(230,236,242,0.68); border: 1px solid rgba(142,197,216,0.24); border-radius: 2px;">Recently added</div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 36px;">

      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div style="width: 100%; height: 460px; background: linear-gradient(158deg, #3d5f6b 0%, #16262d 100%); border: 1px solid rgba(142,197,216,0.12);"></div>
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <div style="font-size: 20px; color: rgba(230,236,242,0.92);">Ashfall</div>
          <div style="font-size: 16px; color: rgba(230,236,242,0.42);">2021</div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div style="position: relative;">
          <div style="width: 100%; height: 460px; background: linear-gradient(158deg, #4a6f52 0%, #16241a 100%);"></div>
          <div style="position: absolute; inset: -10px; border: 1px solid rgba(142,197,216,0.42);"></div>
          <div style="position: absolute; left: -14px; top: -14px; width: 30px; height: 30px; border-left: 3px solid #8ec5d8; border-top: 3px solid #8ec5d8;"></div>
          <div style="position: absolute; right: -14px; top: -14px; width: 30px; height: 30px; border-right: 3px solid #8ec5d8; border-top: 3px solid #8ec5d8;"></div>
          <div style="position: absolute; left: -14px; bottom: -14px; width: 30px; height: 30px; border-left: 3px solid #8ec5d8; border-bottom: 3px solid #8ec5d8;"></div>
          <div style="position: absolute; right: -14px; bottom: -14px; width: 30px; height: 30px; border-right: 3px solid #8ec5d8; border-bottom: 3px solid #8ec5d8;"></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <div style="font-size: 20px; color: #ffffff; font-weight: 500;">The Salt Road</div>
          <div style="font-size: 16px; color: #8ec5d8;">2024 &middot; HEVC 4K</div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div style="width: 100%; height: 460px; background: linear-gradient(158deg, #55486d 0%, #1c1826 100%); border: 1px solid rgba(142,197,216,0.12);"></div>
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <div style="font-size: 20px; color: rgba(230,236,242,0.92);">Nightjar</div>
          <div style="font-size: 16px; color: rgba(230,236,242,0.42);">2019</div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div style="width: 100%; height: 460px; background: linear-gradient(158deg, #6d5c41 0%, #241f16 100%); border: 1px solid rgba(142,197,216,0.12);"></div>
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <div style="font-size: 20px; color: rgba(230,236,242,0.92);">Quiet Coast</div>
          <div style="font-size: 16px; color: rgba(230,236,242,0.42);">2023</div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div style="width: 100%; height: 460px; background: linear-gradient(158deg, #6a4149 0%, #23161a 100%); border: 1px solid rgba(142,197,216,0.12);"></div>
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <div style="font-size: 20px; color: rgba(230,236,242,0.92);">Meridian</div>
          <div style="font-size: 16px; color: rgba(230,236,242,0.42);">2018</div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div style="width: 100%; height: 460px; background: linear-gradient(158deg, #33566e 0%, #121f28 100%); border: 1px solid rgba(142,197,216,0.12);"></div>
        <div style="font-size: 20px; color: rgba(230,236,242,0.92);">Low Tide</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div style="width: 100%; height: 460px; background: linear-gradient(158deg, #5d4a34 0%, #201a12 100%); border: 1px solid rgba(142,197,216,0.12);"></div>
        <div style="font-size: 20px; color: rgba(230,236,242,0.92);">Ferrous</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div style="width: 100%; height: 460px; background: linear-gradient(158deg, #40616a 0%, #162327 100%); border: 1px solid rgba(142,197,216,0.12);"></div>
        <div style="font-size: 20px; color: rgba(230,236,242,0.92);">Hollow Point</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div style="width: 100%; height: 460px; background: linear-gradient(158deg, #4c4f75 0%, #191a28 100%); border: 1px solid rgba(142,197,216,0.12);"></div>
        <div style="font-size: 20px; color: rgba(230,236,242,0.92);">Cassini</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div style="width: 100%; height: 460px; background: linear-gradient(158deg, #6b4a3a 0%, #241813 100%); border: 1px solid rgba(142,197,216,0.12);"></div>
        <div style="font-size: 20px; color: rgba(230,236,242,0.92);">The Long Winter</div>
      </div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
