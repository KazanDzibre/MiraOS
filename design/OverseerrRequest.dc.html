<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Black&display=swap">
  <style>
    body { margin: 0; }
    a { color: #e8b04b; } a:hover { color: #f5cd80; }
  </style>
</helmet>

<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #08080a; font-family: Archivo, system-ui, sans-serif; color: #f6f4f0;">

  <div style="position: absolute; inset: 0; background: radial-gradient(120% 92% at 78% 22%, #4a6a86 0%, #22384a 34%, #0d1418 68%, #08080a 100%);"></div>
  <div style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(6,6,8,0.97) 0%, rgba(6,6,8,0.88) 40%, rgba(6,6,8,0.34) 76%, rgba(6,6,8,0.16) 100%);"></div>
  <div style="position: absolute; inset: 0; background: linear-gradient(0deg, rgba(6,6,8,0.96) 0%, rgba(6,6,8,0.52) 32%, rgba(6,6,8,0.00) 62%);"></div>

  <div style="position: absolute; inset: 0; padding: 72px 80px; box-sizing: border-box; display: flex; flex-direction: column;">

    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; align-items: center; gap: 16px; font-size: 21px; color: rgba(246,244,240,0.66);">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(246,244,240,0.66)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14.6 5.4-6.8 6.6 6.8 6.6"></path></svg>
        <span>Discover</span>
      </div>
      <div style="display: flex; align-items: center; gap: 26px; font-size: 18px; color: rgba(246,244,240,0.62);">
        <div style="display: flex; align-items: center; gap: 9px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6fcf8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8 20 6v5.4c0 5-3.4 8.6-8 9.8-4.6-1.2-8-4.8-8-9.8V6Z"></path><path d="m8.9 12.1 2.1 2.1 4.1-4.3"></path></svg>
          <span style="letter-spacing: 0.06em;">homelab</span>
        </div>
        <div style="font-variant-numeric: tabular-nums;">21:05</div>
      </div>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 30px; max-width: 900px;">

      <div style="display: flex; align-items: center; gap: 14px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6fcf8a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5.4 12.4 4.2 4.2 9-9.4"></path></svg>
        <div style="font-size: 15px; letter-spacing: 0.30em; color: #6fcf8a; font-weight: 600;">REQUEST SENT</div>
      </div>

      <div style="font-family: 'Archivo Black', Archivo, sans-serif; font-size: 76px; line-height: 0.96; letter-spacing: -0.02em;">The Ninth Hour</div>

      <div style="display: flex; align-items: center; gap: 16px; font-size: 19px; color: rgba(246,244,240,0.70);">
        <span>2025</span>
        <span style="width: 4px; height: 4px; border-radius: 50%; background: rgba(246,244,240,0.36);"></span>
        <span>2 h 06 m</span>
        <span style="width: 4px; height: 4px; border-radius: 50%; background: rgba(246,244,240,0.36);"></span>
        <span>Thriller</span>
      </div>

      <div style="display: flex; gap: 44px; padding-top: 4px;">
        <div style="display: flex; flex-direction: column; gap: 5px;">
          <div style="font-size: 16px; color: rgba(246,244,240,0.46);">Quality</div>
          <div style="font-size: 21px; color: #f6f4f0;">4K HEVC preferred</div>
        </div>
        <div style="width: 1px; background: rgba(246,244,240,0.14);"></div>
        <div style="display: flex; flex-direction: column; gap: 5px;">
          <div style="font-size: 16px; color: rgba(246,244,240,0.46);">Lands in</div>
          <div style="font-size: 21px; color: #f6f4f0;">Films</div>
        </div>
        <div style="width: 1px; background: rgba(246,244,240,0.14);"></div>
        <div style="display: flex; flex-direction: column; gap: 5px;">
          <div style="font-size: 16px; color: rgba(246,244,240,0.46);">Notify</div>
          <div style="font-size: 21px; color: #f6f4f0;">On this box when ready</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 18px; padding-top: 14px;">
        <div style="height: 68px; display: flex; align-items: center; padding: 0 34px; border-radius: 6px; background: #f6f4f0; color: #0b0b0d; font-size: 21px; font-weight: 600; box-shadow: 0 0 0 4px #e8b04b, 0 0 0 10px rgba(232,176,75,0.22);">Keep browsing</div>
        <div style="height: 68px; display: flex; align-items: center; padding: 0 30px; border-radius: 6px; border: 2px solid rgba(246,244,240,0.32); font-size: 21px; color: rgba(246,244,240,0.90);">Cancel request</div>
      </div>

    </div>

    <div style="display: flex; align-items: flex-start; gap: 0;">

      <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; width: 200px;">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: #6fcf8a; display: flex; align-items: center; justify-content: center;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#08080a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5.4 12.4 4.2 4.2 9-9.4"></path></svg>
        </div>
        <div style="font-size: 21px; color: #f6f4f0; font-weight: 500;">Requested</div>
        <div style="font-size: 17px; color: rgba(246,244,240,0.46);">21:04</div>
      </div>

      <div style="flex-grow: 1; height: 3px; background: #6fcf8a; margin-top: 27px;"></div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; width: 200px;">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: #6fcf8a; display: flex; align-items: center; justify-content: center;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#08080a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5.4 12.4 4.2 4.2 9-9.4"></path></svg>
        </div>
        <div style="font-size: 21px; color: #f6f4f0; font-weight: 500;">Approved</div>
        <div style="font-size: 17px; color: rgba(246,244,240,0.46);">21:05, automatic</div>
      </div>

      <div style="flex-grow: 1; height: 3px; margin-top: 27px; background: linear-gradient(90deg, #6fcf8a 0%, #e8b04b 38%, rgba(246,244,240,0.18) 38%, rgba(246,244,240,0.18) 100%);"></div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; width: 200px;">
        <div style="width: 56px; height: 56px; border-radius: 50%; border: 3px solid #e8b04b; background: rgba(232,176,75,0.16); display: flex; align-items: center; justify-content: center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e8b04b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.2v11"></path><path d="m7.6 11 4.4 4.4 4.4-4.4"></path><path d="M4.8 19.2h14.4"></path></svg>
        </div>
        <div style="font-size: 21px; color: #f6f4f0; font-weight: 500;">Downloading</div>
        <div style="font-size: 17px; color: #e8b04b;">38% &middot; ~24 min</div>
      </div>

      <div style="flex-grow: 1; height: 3px; background: rgba(246,244,240,0.18); margin-top: 27px;"></div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; width: 200px;">
        <div style="width: 56px; height: 56px; border-radius: 50%; border: 2px solid rgba(246,244,240,0.24); display: flex; align-items: center; justify-content: center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(246,244,240,0.40)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4.6 19.4 12 7 19.4Z"></path></svg>
        </div>
        <div style="font-size: 21px; color: rgba(246,244,240,0.52);">In your library</div>
        <div style="font-size: 17px; color: rgba(246,244,240,0.34);">not yet</div>
      </div>

    </div>

  </div>
</div>
</x-dc>
</body>
</html>
