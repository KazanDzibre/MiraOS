<!doctype html>
<html>

<body>
<x-dc>
<helmet>

    body { margin: 0; }
    a { color: #e8b04b; } a:hover { color: #f5cd80; }

<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #08080a; font-family: Archivo, system-ui, sans-serif; color: #f6f4f0;">

  <!-- decoded video frame stand-in -->

  <div style="position: absolute; inset: 0; background: radial-gradient(68% 52% at 38% 44%, rgba(255,232,190,0.30) 0%, rgba(255,232,190,0.00) 62%);"></div>

  <div style="position: absolute; inset: 0; padding: 72px 80px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between;">

    <div style="display: flex; justify-content: space-between; align-items: flex-start;">

      </div>
      <div style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 18px; border-radius: 4px; background: rgba(10,10,12,0.62); border: 1px solid rgba(246,244,240,0.16);">
        <span style="width: 9px; height: 9px; border-radius: 50%; background: #6fcf8a;"></span>
        <span style="font-size: 16px; letter-spacing: 0.14em; color: rgba(246,244,240,0.82);">DIRECT PLAY &middot; HEVC 4K &middot; AC3</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 34px;">

      <div style="display: flex; align-items: center; gap: 28px;">

          <div style="position: absolute; left: 0; top: 0; height: 8px; width: 79%; border-radius: 4px; background: rgba(246,244,240,0.34);"></div>
          <div style="position: absolute; left: 0; top: 0; height: 8px; width: 61.5%; border-radius: 4px; background: #e8b04b;"></div>
          <div style="position: absolute; left: 61.5%; top: 50%; width: 22px; height: 22px; margin-left: -11px; margin-top: -11px; border-radius: 50%; background: #e8b04b;"></div>
        </div>
        <div style="font-size: 22px; font-variant-numeric: tabular-nums; color: rgba(246,244,240,0.62); width: 108px; text-align: right;">-45:24</div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;">

        <div></div>

        <div style="display: flex; align-items: center; gap: 30px;">

          </div>
          <div style="width: 96px; height: 96px; border-radius: 50%; background: #f6f4f0; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 4px #e8b04b, 0 0 0 10px rgba(232,176,75,0.22);">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="#0b0b0d"><rect x="6.2" y="4.4" width="4.2" height="15.2" rx="0.8"></rect><rect x="13.6" y="4.4" width="4.2" height="15.2" rx="0.8"></rect></svg>
          </div>

            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#f6f4f0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 5.6v5.2h-5.2"></path><path d="M19.6 10.6a8 8 0 1 0-.9 5.6"></path></svg>
          </div>
        </div>

        <div style="display: flex; align-items: center; justify-content: flex-end; gap: 18px;">
          <div style="height: 68px; display: flex; align-items: center; gap: 13px; padding: 0 24px; border-radius: 6px; border: 2px solid rgba(246,244,240,0.26);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f6f4f0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.2 9.4h3.4l4.2-3.4v12l-4.2-3.4H4.2Z"></path><path d="M15.8 9a4.2 4.2 0 0 1 0 6"></path></svg>
            <span style="font-size: 19px;">English</span>
          </div>
          <div style="height: 68px; display: flex; align-items: center; gap: 13px; padding: 0 24px; border-radius: 6px; border: 2px solid rgba(246,244,240,0.26);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f6f4f0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.2" y="5.4" width="17.6" height="13.2" rx="2"></rect><path d="M7 14.2h3.4M13.2 14.2h3.8"></path></svg>
            <span style="font-size: 19px; color: rgba(246,244,240,0.56);">Off</span>
          </div>
          <div style="height: 68px; width: 68px; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 2px solid rgba(246,244,240,0.26);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f6f4f0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"></circle><path d="M12 11.2v5"></path><path d="M12 7.9h.01"></path></svg>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
</x-dc>
